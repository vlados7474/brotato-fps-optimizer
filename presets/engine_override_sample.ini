; Optional engine-level companion config for Brotato 1.2.0.3 (Godot 3.5-3.7)
; Copy to your Brotato game folder as `override.cfg` (next to Brotato.exe).
; Recommended Steam Launch Options: --enable-mods --render-thread unsafe
; NOTE: Do NOT set physics/2d/thread_model=2 (causes Area2D crashes in Godot 3.x).

[rendering]
batching/parameters/item_reordering_lookahead=12

[physics]
2d/cell_size=64
